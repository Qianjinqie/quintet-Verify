<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quintet-Verify 控制台</title>
<style>
:root{--bg:#0b0f14;--panel:#12181f;--panel2:#0e141b;--line:#26313c;--fg:#e6edf3;--dim:#7d8b99;
--blue:#4f9cff;--green:#2ea66e;--amber:#d29922;--red:#e5534b;--violet:#a371f7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
header h1{font-size:22px;letter-spacing:2px}
header .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
label{font-size:12px;color:var(--dim);display:block;margin-bottom:5px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
border-radius:8px;padding:8px 10px;font-size:13px;outline:none;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--blue);color:#06121f;border:none;border-radius:8px;padding:10px 26px;
font-weight:700;font-size:14px;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn.sm{padding:6px 16px;font-size:12.5px}
.plugs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plug{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px;color:var(--dim)}
.plug input{width:auto;margin-top:3px;accent-color:var(--blue)}
.plug.on{color:var(--fg);border-color:var(--blue)}
.pipe{display:flex;align-items:stretch;gap:0;margin:14px 0 6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.node{flex:0 0 auto}
@media (max-width:640px){
  .wrap{padding:14px 10px 40px}
  header .tag{display:none}
  header h1{font-size:18px}
  .grid.g2,.grid.g3{grid-template-columns:1fr}
  .plugs{grid-template-columns:1fr}
  .node{width:84px;padding:10px 4px}
  .role-row{grid-template-columns:1fr}
}
.node{border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;width:104px;text-align:center;
background:var(--panel2);transition:all .25s}
.node .r{font-size:20px;font-weight:800}.node .n{font-size:11px;color:var(--dim)}
.node.on{border-color:var(--amber);box-shadow:0 0 16px rgba(210,153,34,.5);animation:pl 1s infinite alternate}
.node.ok{border-color:var(--green)}
@keyframes pl{to{transform:translateY(-3px)}}
.lnk{color:var(--dim);align-self:center;padding:0 7px;font-size:18px}
.iter{margin-left:auto;align-self:center;font-size:12px;color:var(--violet);
border:1px dashed var(--violet);border-radius:20px;padding:3px 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 12px;color:var(--dim)}
.chip.g{color:var(--green);border-color:var(--green)}.chip.r{color:var(--red);border-color:var(--red)}
.chip.a{color:var(--amber);border-color:var(--amber)}.chip.v{color:var(--violet);border-color:var(--violet)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{padding:8px 18px;background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;font-weight:600}
.tab.on{color:var(--blue);border-bottom:2px solid var(--blue)}
.body{padding:14px 2px;max-height:480px;overflow-y:auto}
.evt{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed #1c242e;font-size:13px}
.evt time{color:var(--dim);font:11px monospace;min-width:62px;padding-top:2px}
.dot{width:8px}.dot.s{color:var(--amber)}.dot.e{color:var(--green)}
.sum{color:var(--dim)}
.sec{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
.sec .a{color:var(--violet);font:12px monospace}.sec .c{white-space:pre-wrap;margin-top:6px}
.tk{padding:5px 0;border-bottom:1px dashed #1c242e;font-size:12.5px}
.who{display:inline-block;min-width:24px;font-weight:700}
.mk{display:inline-block;min-width:18px;font-weight:800}
.mk.v{color:var(--green)}.mk.u{color:var(--amber)}.mk.r{color:var(--red)}
.hide{display:none!important}
.fb{display:flex;gap:12px;align-items:center;background:rgba(210,153,34,.08);
border:1px solid var(--amber);border-radius:10px;padding:12px 16px;margin-top:12px}
.fb b{color:var(--amber)}
#st{color:var(--dim);font:12px monospace;margin-left:12px}
.role-row{display:grid;grid-template-columns:76px 1fr 1fr 1fr;gap:8px;margin-top:8px;align-items:center}
.role-row .rn{font-size:12px;color:var(--dim)}
details{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2)}
summary{cursor:pointer;font-size:13px;color:var(--blue);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Quintet-Verify</h1>
    <span class="tag">内部稠密认知 ✓/?/✗ × 五者验证</span>
    <span class="tag" id="conn">● 连接中…</span>
  </header>

  <div class="card">
    <div class="grid g2">
      <div>
        <label>任务</label>
        <textarea id="task">评估"用小模型群替代单一大模型完成法律文书审查"这一方案的可行性，给出结论。</textarea>
      </div>
      <div class="grid g2" style="align-content:start">
        <div><label>运行模式</label>
          <select id="mode"><option value="demo">演示（Stub · 秒回）</option><option value="live">真实 LLM</option></select></div>
        <div><label>流水线</label>
          <select id="pipeline"><option value="standard">标准（A→B→C→D→E）</option><option value="fast">Fast（仅 B/C/D）</option><option value="custom">自定义流程（Beta）</option></select></div>
        <div><label>强度分档</label>
          <select id="intensity"><option value="low">low · 精简</option><option value="high" selected>high · 标准</option><option value="max">max · 从严</option></select></div>
        <div><label>熔断上限（1~10）</label>
          <input id="max_iter" type="number" min="1" max="10" value="5"></div>
        <div><label>Pro 模式（C 连续 N 轮零缺陷，D 才审判）</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="pro_on" type="checkbox" style="width:auto;accent-color:var(--blue)">
            <input id="pro_n" type="number" min="1" max="10" value="3" style="width:80px">
          </div></div>
        <div id="spec-box" class="hide" style="grid-column:1/-1"><label>流程定义（支持 - → &gt; 等连接符，如 A-&gt;B-&gt;C-&gt;F-&gt;D-&gt;E）</label>
          <input id="spec" value="A->B->C->D->E">
          <div id="flow-errors" style="font-size:12px;margin-top:6px;"></div></div>
      </div>
    </div>
    <div style="margin-top:12px"><label>内置插件（默认全关，按需开启）</label>
      <div class="plugs" id="plugs"></div>
    </div>
    <details class="live-cfg hide" style="margin-top:12px">
      <summary>API 配置（全局 + 分角色覆盖）</summary>
      <div class="grid g3" style="margin-top:10px">
        <div><label>全局 API Key</label><input id="g_key" type="password" placeholder="sk-..."></div>
        <div><label>全局 Base URL</label><input id="g_url" value="https://api.deepseek.com/v1"></div>
        <div><label>全局模型</label><input id="g_model" value="deepseek-v4-pro"></div>
      </div>
      <div id="roles"></div>
      <label style="margin-top:12px;">角色系统提示词（Beta · 留空=内置默认；自定义字母=新建角色，必填）</label>
      <div id="prompts"></div>
    </details>
    <div style="margin-top:14px;display:flex;align-items:center">
      <button class="btn" id="go">▶ 启动</button><span id="st"></span>
    </div>
  </div>

  <div class="card hide" id="p2">
    <div class="pipe" id="pipe"></div>
    <div class="chips" id="chips"></div>
    <div class="fb hide" id="fb">
      <b>⚖ D 初审通过，等待你表态</b>
      <button class="btn sm" id="ok">✓ 满意，结束</button>
      <button class="btn sm ghost" id="no">✗ 不满意，E 上诉</button>
    </div>
  </div>

  <div class="card hide" id="p3">
    <div class="tabs">
      <button class="tab on" data-t="ev">事件流</button>
      <button class="tab" data-t="dr">草稿</button>
      <button class="tab" data-t="dt">Dense Track</button>
      <button class="tab" data-t="js">状态 JSON</button>
    </div>
    <div class="body" id="t-ev"></div>
    <div class="body hide" id="t-dr"></div>
    <div class="body hide" id="t-dt"></div>
    <div class="body hide" id="t-js"><pre id="raw" style="font-size:11px;white-space:pre-wrap"></pre></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const ROLES={A:'架构师',B:'执行者',C:'验证者',D:'裁判',E:'陪审员'};
let runId=null,timer=null,t0=0;

/* 插件列表：优先从后端拉取，失败则用硬编码兜底（静态预览也能看到开关） */
const FALLBACK_PLUGINS={
  pre_conclusion_bridge:'结论前桥接：B 的结论段必须先引用已激活的中间论点',
  broadcast_hub:'广播枢纽：共享事实/约束由 A 推导一次，B/C/D 同源读取',
  metacog_control:'元认知控制即动作：D 低置信通过时强制 C 独立复核一轮',
  tiered_gating:'三档门控：简单任务跳过 A 直接进 B',
  empirical_escape:'经验逃逸与验证：C 推导停滞或无法判定真伪时，拆解为有限候选断言集并行差分验证，而非空想',
  ledger_checkpoint:'账本与检查点外化：基于 LangGraph checkpointer 已有原子化落盘，叠加编号化开放问题账本与接缝刷新点，支持跨会话续审'};
function renderPlugs(plugins){
  $('#plugs').innerHTML=Object.entries(plugins).map(([k,v])=>
    `<label class="plug"><input type="checkbox" data-k="${k}"><span>${esc(v)}</span></label>`).join('');
  $$('.plug input').forEach(c=>c.onchange=()=>c.closest('.plug').classList.toggle('on',c.checked));
}
/* 统一请求：非 JSON 响应（如静态托管的 XML 错误页）给出可读报错 */
async function jfetch(url,opt){
  const r=await fetch(url,opt);
  const ct=r.headers.get('content-type')||'';
  if(!ct.includes('json'))throw new Error('后端未连接：请在部署了 server.py 的地址访问（静态预览无法运行）');
  const d=await r.json();
  if(!r.ok)throw new Error(d.detail||('请求失败 '+r.status));
  return d;
}
jfetch('/api/plugins').then(d=>{renderPlugs(d.plugins);$('#conn').textContent='● 已连接'})
.catch(()=>{renderPlugs(FALLBACK_PLUGINS);$('#conn').textContent='○ 后端未连接';$('#conn').style.color='var(--red)'});

function renderRoles(){
  const fast=$('#pipeline').value==='fast';
  $('#roles').innerHTML=Object.entries(ROLES).map(([r,n])=>
    `<div class="role-row" style="${fast&&!'BCD'.includes(r)?'display:none':''}">
      <span class="rn">${r} ${n}</span>
      <input id="k${r}" type="password" placeholder="Key（空=全局）">
      <input id="u${r}" placeholder="Base URL（空=全局）">
      <input id="m${r}" placeholder="模型（空=全局）">
      <input id="t${r}" type="number" step="0.1" min="0" max="2" placeholder="temp 0.2" style="grid-column:2/3">
    </div>`).join('');
}
const SEP_RE=/[\s\-‐‑‒–—―−>＞→➔⟶]+/;
const parseSpec=s=>s.split(SEP_RE).map(x=>x.trim().toUpperCase()).filter(x=>/^[A-Z]$/.test(x));
function usedLetters(){
  const p=$('#pipeline').value;
  if(p==='fast')return['B','C','D'];
  if(p==='custom'){const s=parseSpec($('#spec').value);return s.length?s:['A','B','C','D','E']}
  return['A','B','C','D','E'];
}
function renderPrompts(){
  const g={url:$('#g_url').value,model:$('#g_model').value};
  $('#prompts').innerHTML=usedLetters().map(l=>{
    const known='ABCDE'.includes(l);
    if(known)return `<div style="margin-top:8px"><label>${l} ${ROLES[l]}</label>
      <textarea data-l="${l}" class="rp" style="min-height:44px" placeholder="留空使用内置提示词"></textarea></div>`;
    // v1.4：新建角色配置卡（默认从全局克隆）
    return `<div style="margin-top:10px;border:1px solid var(--violet);border-radius:8px;padding:10px 12px;background:var(--panel2)">
      <label style="color:var(--violet)">${l} 自定义角色 · 配置卡</label>
      <textarea data-l="${l}" class="rp" style="min-height:44px" placeholder="填写新角色 ${l} 的系统提示词"></textarea>
      <div class="role-row" style="grid-template-columns:1fr 1fr">
        <div><label>权限继承</label>
          <select data-l="${l}" class="ri">
            <option value="">不继承（通用产出）</option>
            <option value="A">继承 A · 仅提纲/冻结区</option>
            <option value="B">继承 B · 填内容不改框架</option>
            <option value="C">继承 C · 只提意见</option>
            <option value="D">继承 D · 裁决权</option>
            <option value="E">继承 E · 仅异议申请</option>
          </select></div>
        <div><label>temperature</label><input data-l="${l}" class="rt" type="number" step="0.1" min="0" max="2" placeholder="0.2"></div>
        <div><label>API Key</label><input data-l="${l}" class="rk" type="password" placeholder="留空用全局"></div>
        <div><label>Base URL</label><input data-l="${l}" class="ru" placeholder="${g.url}"></div>
        <div><label>模型</label><input data-l="${l}" class="rm" placeholder="${g.model}"></div>
      </div></div>`}).join('');
}
$('#mode').onchange=e=>$$('.live-cfg').forEach(el=>el.classList.toggle('hide',e.target.value!=='live'));
$('#pipeline').onchange=()=>{
  $('#spec-box').classList.toggle('hide',$('#pipeline').value!=='custom');
  renderRoles();renderPipe([]);renderPrompts();
};
let _vfT=null;
async function validateSpec(){
  if($('#pipeline').value!=='custom')return;
  const defined=['A','B','C','D','E',...$$('.ri').map(s=>s.dataset.l).filter((l,i,arr)=>arr.indexOf(l)===i)];
  try{
    const d=await jfetch('/api/validate-flow',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({definition:$('#spec').value,defined_roles:defined})});
    const box=$('#flow-errors');
    if(d.errors&&d.errors.length){box.innerHTML=d.errors.map(e=>'⚠ '+esc(e)).join('<br>');box.style.color='var(--red)'}
    else{box.textContent='✓ 流程校验通过';box.style.color='var(--green)'}
  }catch(e){/* 静态预览时静默 */}
}
$('#spec').oninput=()=>{renderPipe([]);renderPrompts();
  clearTimeout(_vfT);_vfT=setTimeout(validateSpec,400)};
renderRoles();renderPrompts();

$$('.tab').forEach(b=>b.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.remove('on'));
  $$('.body').forEach(x=>x.classList.add('hide'));
  b.classList.add('on');$('#t-'+b.dataset.t).classList.remove('hide');
});

function renderPipe(events){
  const seq=usedLetters();
  const done=new Set(events.filter(e=>e.type==='end').map(e=>e.node[0]));
  let active=null;
  for(let i=events.length-1;i>=0;i--){
    const e=events[i];
    if(e.type==='start'&&!events.slice(i+1).some(x=>x.type==='end'&&x.node===e.node)){active=e.node[0];break}
  }
  $('#pipe').innerHTML=seq.map((r,i)=>
    `${i?'<span class="lnk">'+(r==='E'?'⇢':'→')+'</span>':''}
    <div class="node ${done.has(r)?'ok':''} ${r===active?'on':''}">
      <div class="r">${r}</div><div class="n">${ROLES[r]||'自定义'}</div></div>`).join('')
    +'<span class="iter" id="iter">返工 0/5</span>';
}

$('#go').onclick=async()=>{
  const mode=$('#mode').value;
  const body={task:$('#task').value,mode,pipeline:$('#pipeline').value,
    intensity:$('#intensity').value,max_iterations:+$('#max_iter').value||5,
    pro_zero_rounds:($('#pro_on').checked?((+$('#pro_n').value)||3):0),
    plugins:Object.fromEntries($$('.plug input').map(c=>[c.dataset.k,c.checked]))};
  if(body.pipeline==='custom')body.pipeline_spec=$('#spec').value;
  body.role_prompts={};body.custom_roles={};
  $$('.rp').forEach(t=>{
    const l=t.dataset.l,v=t.value.trim();
    if('ABCDE'.includes(l)){if(v)body.role_prompts[l]=v;return}
    body.custom_roles[l]=body.custom_roles[l]||{};
    body.custom_roles[l].system_prompt=v;
  });
  $$('.ri').forEach(s=>{if(s.value){(body.custom_roles[s.dataset.l]=body.custom_roles[s.dataset.l]||{}).inherits_from=s.value}});
  [['.rk','api_key'],['.ru','base_url'],['.rm','model']].forEach(([cls,key])=>{
    $$(cls).forEach(i=>{if(i.value.trim()){(body.custom_roles[i.dataset.l]=body.custom_roles[i.dataset.l]||{})[key]=i.value.trim()}})});
  $$('.rt').forEach(i=>{if(i.value!==''){(body.custom_roles[i.dataset.l]=body.custom_roles[i.dataset.l]||{}).temperature=parseFloat(i.value)}});
  if(body.pipeline==='custom'&&mode==='live'){
    const missing=parseSpec($('#spec').value).filter(l=>!'ABCDE'.includes(l)&&!(body.custom_roles[l]&&body.custom_roles[l].system_prompt));
    if(missing.length){alert('自定义角色 '+missing.join('、')+' 需要填写系统提示词');return}
  }
  if(mode==='live'){
    body.api_key=$('#g_key').value.trim();body.base_url=$('#g_url').value.trim();body.model=$('#g_model').value.trim();
    body.roles={};
    for(const r of Object.keys(ROLES)){
      const k=$(('#k'+r))?.value.trim(),u=$(('#u'+r))?.value.trim(),m=$(('#m'+r))?.value.trim();
      const t=$('#t'+r)?.value;
      if(k||u||m||t)body.roles[r]={api_key:k||'',base_url:u||'',model:m||'',...(t!==''&&t!=null?{temperature:parseFloat(t)}:{})};
    }
    const need=body.pipeline==='fast'?'BCD':'ABCDE';
    if(!body.api_key&&![...need].some(r=>body.roles[r]&&body.roles[r].api_key)){alert('请填 API Key（全局或在用角色）');return}
  }
  $('#go').disabled=true;$('#p2').classList.remove('hide');$('#p3').classList.remove('hide');
  $('#fb').classList.add('hide');$('#chips').innerHTML='';$('#t-ev').innerHTML='';$('#t-dr').innerHTML='';$('#t-dt').innerHTML='';
  renderPipe([]);
  try{
    const d=await jfetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    runId=d.run_id;t0=Date.now();
    timer=setInterval(poll,1200);poll();
  }catch(e){alert(e.message);$('#go').disabled=false}
};

async function poll(){
  if(!runId)return;
  let d;
  try{d=await jfetch('/api/runs/'+runId)}
  catch(e){$('#st').textContent='连接中断：'+e.message;clearInterval(timer);timer=null;$('#go').disabled=false;return}
  draw(d);
  if(d.status==='done'||d.status==='error'){clearInterval(timer);timer=null;$('#go').disabled=false}
}

function draw(d){
  $('#st').textContent='run='+d.id+' · '+d.status+' · '+(((Date.now()-t0)/1000)|0)+'s'+(d.error?' · '+d.error:'');
  renderPipe(d.events||[]);
  const p=d.public;
  if(p){
  $('#iter').textContent='返工 '+p.iteration+'/'+p.max_iterations;
  let c='<span class="chip v">'+(p.pipeline==='fast'?'Fast':'标准')+' · '+p.intensity+'</span>';
  if(p.pro_zero_rounds>0)c+='<span class="chip v">Pro · 零缺陷×'+p.pro_zero_rounds+'</span>';
    if(p.hub)c+='<span class="chip v">广播枢纽已激活</span>';
    if(p.outline)c+='<span class="chip">提纲 '+p.outline.nodes.length+' 节点 · 冻结 '+p.outline.nodes.filter(x=>x.frozen).length+'</span>';
    if(p.critic_report){const ds=p.critic_report.defects;
      c+=ds.length?'<span class="chip a">缺陷 '+ds.length+'（S×'+ds.filter(x=>x.severity==='S').length+' A×'+ds.filter(x=>x.severity==='A').length+'）</span>'
                  :'<span class="chip g">C 零缺陷（coverage 已附）</span>'}
    if(p.verdict)c+=p.verdict.critic_overfit?'<span class="chip a">D 判 C 过拟合</span>'
      :p.verdict.approved?'<span class="chip g">D 通过 · '+p.verdict.confidence_score+'</span>'
      :'<span class="chip r">D 打回 B · '+p.verdict.remand_coordinates.length+' 坐标</span>';
    if(p.draft&&p.draft.ripple)c+='<span class="chip '+(p.draft.ripple.affects_frozen_zone?'r':'g')+'">涟漪：'+(p.draft.ripple.affects_frozen_zone?'波及冻结区':'不波及')+'</span>';
    if(p.final_ruling)c+='<span class="chip '+(p.final_ruling.gag_order?'r':'g')+'">终审：'+(p.final_ruling.gag_order?'禁言令':p.final_ruling.upheld?'维持':'改判')+'</span>';
    $('#chips').innerHTML=c;
    $('#t-dr').innerHTML=p.draft?p.draft.sections.map(s=>
      '<div class="sec"><span class="a">'+esc(s.anchor_id)+'</span><div class="c">'+esc(s.content)+'</div></div>').join(''):'';
    $('#raw').textContent=JSON.stringify(p,null,2);
  }
  $('#fb').classList.toggle('hide',d.status!=='awaiting_feedback');
  $('#t-ev').innerHTML=(d.events||[]).map(e=>
    '<div class="evt"><time>'+new Date(e.t*1000).toLocaleTimeString('zh-CN',{hour12:false})+'</time>'+
    '<span class="dot '+(e.type==='start'?'s':'e')+'">●</span><b>'+esc(e.node)+'</b>'+
    '<span class="sum">'+(e.type==='start'?'工作中…':esc(e.summary||'完成'))+'</span></div>').join('');
  $('#t-dt').innerHTML=(d.dense||[]).map(t=>{
    const k=t.mark==='✓'?'v':t.mark==='✗'?'r':'u';
    return '<div class="tk"><span class="who">'+t.agent+'</span><span class="mk '+k+'">'+t.mark+'</span>'+esc(t.claim)+'</div>'}).join('');
}

async function fb(s){
  $('#fb').classList.add('hide');
  try{await jfetch('/api/runs/'+runId+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({satisfied:s})})}
  catch(e){alert(e.message);return}
  if(!timer)timer=setInterval(poll,1200);
}
$('#ok').onclick=()=>fb(true);
$('#no').onclick=()=>fb(false);
</script>
</body>
</html>
